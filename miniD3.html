    <header class="hero-section">
        <h1>Mini D3 Assignment— Circles on Click</h1>
        <h3>Click anywhere on the canvas below to add a circle at the exact coordinates. The canvas keeps a maximum of 10 circles (oldest removed).</h3>
    </header> 

    <main class="visualization-section">
    <section class="section">
        <svg id="mini-stage"
            viewBox="0 0 960 540"
            preserveAspectRatio="xMidYMid slice"
            aria-label="D3 interactive canvas for adding circles"
            style="display:block; width:100%; height:auto; background:white; cursor:crosshair;">
        </svg>
    </section>
    </main>
